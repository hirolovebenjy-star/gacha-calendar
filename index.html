<style>

e:18px}.filter{display:flex;background:#e9e4df;padding:4px;gap:3px;border-radius:12px}.filter button{border:0;background:transparent;padding:8px 12px}.filter button.active{background:#fff;color:var(--ink);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{position:relative;min-height:192px;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.card:after{content:"";position:absolute;right:-55px;bottom:-70px;width:175px;height:175px;border-radius:50%;background:var(--soft)}.card>*{position:relative;z-index:1}.kind{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--brand)}.fav{float:right;border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:30px;color:var(--muted);font-size:16px;cursor:pointer}.fav.on{color:#c45f7a}.card h3{font-size:20px;margin:15px 0 7px}.detail{font-size:13px;color:var(--muted);line-height:1.55;min-height:40px}.period{font-size:12px;font-weight:700;margin:14px 0 8px}.track{height:7px;border-radius:99px;background:#ece8e3;overflow:hidden}.track i{display:block;background:var(--brand);height:100%;width:12%;border-radius:99px}.remain{font-size:11px;color:var(--muted);margin-top:7px}.notice{margin-top:26px;padding:18px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.notice h2{font-size:16px;margin:0 0 7px}.notice p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.foot{font-size:11px;color:var(--muted);line-height:1.7;margin:20px 2px}.foot a{color:var(--brand)}@media(max-width:650px){.shell{padding:19px 14px 35px}.updated{display:none}.hero{grid-template-columns:1fr;padding:23px}.hero h1{font-size:23px}.count{border:0;border-top:1px solid #ffffff3d;padding:17px 0 0}.grid{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}.game-tabs{margin-top:20px}.game-tabs button{padding:8px 10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">✦</div><div><div class="over" id="brandName">GENSHIN IMPACT</div><div class="title">ガチャカレンダー</div></div></div><div class="updated">最終更新<br><b id="updated">2026年9月23日 JST</b></div></header><nav class="game-tabs" id="gameTabs" aria-label="ゲームを切り替え"></nav><section class="hero"><div><div class="over" id="version">VERSION 7.1</div><h1 id="heroTitle">次の祈願は 9月23日 11:00 より</h1><p id="heroText">実施中・予定のイベント祈願をひと目で確認できます。</p><div class="meta"><span>アジアサーバー基準</span><span>表示: 日本時間</span></div></div><div class="count"><small id="countLabel">開始まで</small><strong id="countdown">--日 --:--:--</strong><span id="countNote">2026年9月23日 11:00</span></div></section><div class="bar"><h2 id="listTitle">祈願一覧</h2><div class="filter"><button class="active" data-filter="all">すべて</button><button data-filter="character">キャラクター</button><button data-filter="weapon">武器</button></div></div><section class="grid" id="cards"></section><section class="notice"><h2 id="noticeTitle">スケジュールの確認</h2><p id="noticeText"></p></section><p class="foot">※ 表示は日本時間です。予定は変更される場合があります。各タイトルのゲーム内お知らせ・公式サイトで最終確認してください。</p></main><script>
const games={
 genshin:{name:'原神',brand:'GENSHIN IMPACT',version:'VERSION 7.1',color:'#6655ac',deep:'#302853',soft:'#eeeaff',title:'次の祈願は 9月23日 11:00 より',text:'実施中・予定のイベント祈願をひと目で確認できます。',start:'2026-09-23T11:00:00+09:00',end:'2026-10-14T17:59:00+09:00',note:'前半祈願は 10月14日 17:59 まで',url:'https://genshin.hoyoverse.com/ja/news',cards:[['character','イベント祈願・キャラクター','春暁の舞','★5 ヴェスナ','9/23 11:00 — 10/14 17:59'],['character','イベント祈願・キャラクター','潮騒の歌','★5 ヴォジャニツァ','9/23 11:00 — 10/14 17:59'],['weapon','イベント祈願・武器','神鋳賦形','★5 武器ピックアップ','9/23 11:00 — 10/14 17:59'],['standard','常設祈願','奔走世間','★5／★4 キャラクター・武器','常時開催']]},
 starrail:{name:'崩壊：スターレイル',brand:'HONKAI: STAR RAIL',version:'WARP SCHEDULE',color:'#4778b9',deep:'#253d68',soft:'#e5f0ff',title:'跳躍スケジュールを確認',text:'限定跳躍・光円錐イベント跳躍をまとめて管理できます。',note:'最新の跳躍期間は公式告知を確認してください。',url:'https://hsr.hoyoverse.com/ja-jp/news',cards:[['character','イベント跳躍・キャラクター','限定キャラクター跳躍','最新ピックアップは公式告知を確認','公式発表待ち'],['weapon','イベント跳躍・光円錐','限定光円錐跳躍','最新ピックアップは公式告知を確認','公式発表待ち'],['standard','常設跳躍','群星躍動','恒常キャラクター・光円錐','常時開催']]},
 zzz:{name:'ゼンレスゾーンゼロ',brand:'ZENLESS ZONE ZERO',version:'SIGNAL SEARCH',color:'#e27335',deep:'#71351f',soft:'#ffeadc',title:'Ver.3.2 前半チャンネル開催中',text:'限定S級エージェントと音動機の変調を確認できます。',start:'2026-09-09T11:00:00+09:00',end:'2026-09-30T12:59:00+09:00',note:'期間は 9月30日 12:59 まで（JST換算）',url:'https://zenless.hoyoverse.com/ja-jp/news/165979',cards:[['character','独占チャンネル','紅月昇騰 / 迷情の公理','S級 クラレッタ / 南宮羽','9/9 アップデート後 — 9/30 12:59'],['weapon','音動機チャンネル','緋月の渇望 / ネオンファンタジー','S級音動機 ピックアップ','9/9 アップデート後 — 9/30 12:59'],['standard','常設チャンネル','話題のキャスト','常設エージェント・音動機','常時開催']]},
 nte:{name:'NTE',brand:'NEVERNESS TO EVERNESS',version:'NTE',color:'#8764ac',deep:'#34244e',soft:'#f0e7fa',title:'ガチャ情報を準備中',text:'正式サービス開始後に、限定バナーの予定をここで確認できます。',note:'NTEの公式発表を確認してください。',url:'https://nte.perfectworld.com/',cards:[['character','限定バナー','キャラクターガチャ','公式発表待ち','公式発表待ち'],['weapon','装備バナー','武器・装備ガチャ','公式発表待ち','公式発表待ち']]},
 wuthering:{name:'鳴潮',brand:'WUTHERING WAVES',version:'CONVENE',color:'#3b8a80',deep:'#1e4e4a',soft:'#e1f5ef',title:'集音スケジュールを確認',text:'限定共鳴者・武器の集音情報をまとめて確認できます。',note:'最新の集音期間は公式告知を確認してください。',url:'https://wutheringwaves.kurogames.com/jp/main/news',cards:[['character','イベント集音・キャラクター','限定共鳴者集音','最新ピックアップは公式告知を確認','公式発表待ち'],['weapon','イベント集音・武器','限定武器集音','最新ピックアップは公式告知を確認','公式発表待ち'],['standard','常設集音','恒常集音','恒常共鳴者・武器','常時開催']]}
};let selected=localStorage.getItem('gacha-game')||'genshin',filter='all';const $=s=>document.querySelector(s);function apply(){const g=games[selected];document.documentElement.style.setProperty('--brand',g.color);document.documentElement.style.setProperty('--deep',g.deep);document.documentElement.style.setProperty('--soft',g.soft);$('#brandName').textContent=g.brand;$('#version').textContent=g.version;$('#heroTitle').textContent=g.title;$('#heroText').textContent=g.text;$('#noticeTitle').textContent=g.name+'：スケジュールの確認';$('#noticeText').innerHTML=`このタイトルは更新頻度が高いため、表示前に <a href="${g.url}" target="_blank" rel="noreferrer">公式お知らせ</a> を確認してください。`;$('#listTitle').textContent=g.name==='原神'?'祈願一覧':g.name+' ガチャ一覧';$('#gameTabs').innerHTML=Object.entries(games).map(([id,x])=>`<button class="${id===selected?'active':''}" data-game="${id}">${x.name}</button>`).join('');$('#gameTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.game;localStorage.setItem('gacha-game',selected);apply()});$('#cards').innerHTML=g.cards.map((x,i)=>`<article class="card" data-kind="${x[0]}"><button class="fav" data-fav="${selected}-${i}">♡</button><div class="kind">${x[1]}</div><h3>${x[2]}</h3><div class="detail">${x[3]}</div><div class="period">${x[4]}</div><div class="track"><i></i></div><div class="remain" data-permanent="${x[4]==='常時開催'}">${x[4]==='常時開催'?'終了予定なし':g.start?'計算中':'公式お知らせを確認'}</div></article>`).join('');paintFavs();refresh()}function paintFavs(){const favs=JSON.parse(localStorage.getItem('gacha-favorites')||'[]');document.querySelectorAll('.fav').forEach(b=>{const on=favs.includes(b.dataset.fav);b.textContent=on?'♥':'♡';b.classList.toggle('on',on);b.onclick=()=>{const p=favs.indexOf(b.dataset.fav);p<0?favs.push(b.dataset.fav):favs.splice(p,1);localStorage.setItem('gacha-favorites',JSON.stringify(favs));paintFavs()}})}function refresh(){const g=games[selected],now=new Date();if(!g.start){$('#countLabel').textContent='公式告知';$('#countdown').textContent='確認待ち';$('#countNote').textContent=g.note;return}if(g.end){const remaining=Math.max(0,new Date(g.end)-now),ratio=Math.max(3,Math.min(100,(now-new Date(g.start))/(new Date(g.end)-new Date(g.start))*100));document.querySelectorAll('.card .remain').forEach(x=>{if(x.dataset.permanent!=='true')x.textContent=remaining>0?`残り ${Math.ceil(remaining/86400000)} 日`:'終了'});document.querySelectorAll('.card .track i').forEach(x=>x.style.width=ratio+'%')}const d=new Date(g.start)-now;if(d>0){$('#countLabel').textContent='開始まで';$('#countdown').textContent=`${Math.floor(d/86400000)}日 ${String(Math.floor(d/3600000)%24).padStart(2,'0')}:${String(Math.floor(d/60000)%60).padStart(2,'0')}:${String(Math.floor(d/1000)%60).padStart(2,'0')}`;$('#countNote').textContent=g.start.replace('T',' ').slice(0,16)}else{$('#countLabel').textContent='現在';$('#countdown').textContent='開催中';$('#countNote').textContent=g.note}}document.querySelectorAll('.filter button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.card').forEach(c=>c.hidden=filter!=='all'&&c.dataset.kind!==filter)});apply();setInterval(refresh,1000);
</script></body></html>
